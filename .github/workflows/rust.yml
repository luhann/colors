name: Rust Workspace CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always
  # Set the target as an env variable to keep commands clean
  TARGET: x86_64-unknown-linux-musl 

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 1. Install the musl compiler tools on the Ubuntu host
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # 2. Use the official rust-toolchain action to easily add the target
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Added target to the cache key so musl artifacts are cached correctly
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Toolchain info
        run: |
          rustc --version
          cargo --version

      # 3. Append --target to your cargo commands
      - name: Check (release)
        run: cargo check --workspace --release --target $TARGET

      - name: Build (release)
        run: cargo build --workspace --release --target $TARGET

      - name: Tests (release)
        run: cargo test --workspace --release --target $TARGET

      - name: Doc tests (release)
        run: cargo test --doc --workspace --release --target $TARGET
