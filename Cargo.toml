[workspace]
members = [
    "crates/*",
]
default-members = ["crates/colorctl"]
resolver = "3"

[workspace.dependencies]
black = { path = "crates/black" }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.0.0"
hextorgb = { path = "crates/hextorgb", features = ["cli"] }
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
rayon = "1.10.0"
rgbtohex = { path = "crates/rgbtohex", features = ["cli"] }

[workspace.package]
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
