[package]
name = "colors"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Luke Hannan"]

[workspace]
members = [
    "crates/black",
    "crates/hextorgb",
    "crates/rgbtohex",
    "crates/colorctl",
]
default-members = ["crates/colorctl"]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
