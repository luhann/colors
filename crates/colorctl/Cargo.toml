[package]
name = "colorctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/luhann/colors"
authors = ["Luke Hannan"]
description = "Unified color manipulation CLI and toolkit"
default-run = "colorctl"

[[bin]]
name = "colorctl"
path = "src/main.rs"

[dependencies]
black = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
hextorgb = { workspace = true }
rgbtohex = { workspace = true }
rayon = { workspace = true }
